# See https://wiki.hyprland.org/Configuring/Keywords/
#  &  https://wiki.hyprland.org/Configuring/Binds/

# Main modifier
$mainMod = Super # super / meta / windows key

# Assign apps
$term = kitty
$editor = nvim-qt
$file = nemo
$browser = librewolf

# Window/Session actions
bind = $mainMod, Q, exec, $scrPath/dontkillsteam.sh # close focused window
bind = Alt,F4, exec, $scrPath/dontkillsteam.sh # close focused window
bind = $mainMod, Delete, exit, # kill hyprland session
bind = $mainMod, W, togglefloating, # toggle the window between focus and float
bind = Alt, Return, fullscreen, # toggle the window between focus and fullscreen
bind = $mainMod, Home, exec, hyprlock # launch lock screen FIXME
# bind = $mainMod, Backspace, exec, $scrPath/logoutlaunch.sh # launch logout menu FIXME
bind = Ctrl+Alt, W, exec, killall waybar || waybar # toggle waybar

# Application shortcuts
bind = $mainMod, Return, exec, $term # launch terminal emulator
bind = $mainMod, L, exec, $file # launch file manager 
bind = $mainMod, F, exec, $browser # launch file manager 
bind = $mainMod, U, exec, $editor # launch text editor FIXME
# bind = Ctrl+Shift, Escape, exec, $scrPath/sysmonlaunch.sh # launch system monitor (htop/btop or fallback to top) FIXME

# Rofi menus
# bind = $mainMod, R, exec, pkill -x rofi || rofi -show run # launch application launcher FIXME
bind = $mainMod, R, exec, pkill -x rofi || /home/demi/.config/rofi/launchers/type-6/launcher.sh # launch application launcher FIXME
bind = $mainMod, C, exec, pkill -x rofi || rofi -modi clipboard:$scrPath/cliphist.sh -show clipboard -show-icons # launch clipboard FIXME
# bind = $mainMod, D, exec, pkill -x rofi || $scrPath/rofilaunch.sh d # launch application launcher FIXME
#bind = $mainMod, Tab, exec, pkill -x rofi || $scrPath/rofilaunch.sh w # launch window switcher FIXME
#bind = $mainMod+Shift, E, exec, pkill -x rofi || $scrPath/rofilaunch.sh f # launch file explorer FIXME

# Audio control
bindl  = , XF86AudioMute, exec, $scrPath/volume.sh --toggle # toggle audio mute
bindl  = , XF86AudioMicMute, exec, $scrPath/volume.sh --toggle-mic # toggle microphone mute
bindel = , XF86AudioRaiseVolume, exec, $scrPath/volume.sh  --inc # increase volume
bindel = , XF86AudioLowerVolume, exec, $scrPath/volume.sh  --dec # decrease volume

# Media control

bind = , Pause, exec, playerctl play-pause # toggle between media play and pause
# bind = , Pause, exec, playerctl next # if pressed 2 times skips to next songs
# bind = , Pause, exec, playerctl previous # if pressed 3 times return to previous
# bindl  = , XF86AudioNext, exec, playerctl next # media next
# bindl  = , XF86AudioPrev, exec, playerctl previous # media previous

# Brightness control
bindel = , XF86MonBrightnessUp, exec, $scrPath/backlight.sh --inc # increase brightness FIXME
bindel = , XF86MonBrightnessDown, exec, $scrPath/backlight.sh --dec # decrease brightness FIXME

# Screenshot/Screencapture
# bind = $mainMod, P, exec, $scrPath/screenshot.sh s # partial screenshot capture FIXME
# bind = $mainMod+Ctrl, P, exec, $scrPath/screenshot.sh sf # partial screenshot capture (frozen screen) FIXME
# bind = $mainMod+Alt, P, exec, $scrPath/screenshot.sh m # monitor screenshot capture FIXME
# bind = , Print, exec, $scrPath/screenshot.sh p # all monitors screenshot capture FIXME

# Custom scripts
# bind = $mainMod+Alt, G, exec, $scrPath/gamemode.sh # disable hypr effects for gamemode FIXME
# bind = $mainMod+Alt, Right, exec, $scrPath/swwwallpaper.sh -n # next wallpaper FIXME
# bind = $mainMod+Alt, Left, exec, $scrPath/swwwallpaper.sh -p # previous wallpaper FIXME
#bind = $mainMod+Alt, Up, exec, $scrPath/wbarconfgen.sh n # next waybar mode FIXME
#bind = $mainMod+Alt, Down, exec, $scrPath/wbarconfgen.sh p # previous waybar mode FIXME
# bind = $mainMod+Shift, R, exec, pkill -x rofi || $scrPath/wallbashtoggle.sh -m # launch wallbash mode select menu FIXME
# bind = $mainMod+Shift, T, exec, pkill -x rofi || $scrPath/themeselect.sh # launch theme select menu FIXME
# bind = $mainMod+Shift, D, exec, pkill -x rofi || $scrPath/rofiselect.sh # launch select menu FIXME
# bind = $mainMod+Shift, W, exec, pkill -x rofi || $scrPath/swwwallselect.sh # launch wallpaper select menu FIXME
bindl = $mainMod, Space, exec, $scrPath/kbdswitch.sh # switch keyboard layout FIXME

# Move/Change window focus
bind = $mainMod, M, movefocus, l
bind = $mainMod, N, movefocus, r
bind = $mainMod, E, movefocus, u
bind = $mainMod, I, movefocus, d
bind = Alt, Tab, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces to a relative workspace
bind = $mainMod+Ctrl, bracketright, workspace, r+1
bind = $mainMod+Ctrl, bracketleft, workspace, r-1

# Move to the first empty workspace
bind = $mainMod+Ctrl, Down, workspace, empty 

# Resize windows
binde = $mainMod+Shift, M, resizeactive, 30 0
binde = $mainMod+Shift, N, resizeactive, -30 0
binde = $mainMod+Shift, E, resizeactive, 0 -30
binde = $mainMod+Shift, I, resizeactive, 0 30

# Move focused window to a workspace
bind = $mainMod+Shift, 1, movetoworkspace, 1
bind = $mainMod+Shift, 2, movetoworkspace, 2
bind = $mainMod+Shift, 3, movetoworkspace, 3
bind = $mainMod+Shift, 4, movetoworkspace, 4
bind = $mainMod+Shift, 5, movetoworkspace, 5
bind = $mainMod+Shift, 6, movetoworkspace, 6
bind = $mainMod+Shift, 7, movetoworkspace, 7
bind = $mainMod+Shift, 8, movetoworkspace, 8
bind = $mainMod+Shift, 9, movetoworkspace, 9
bind = $mainMod+Shift, 0, movetoworkspace, 10

# Move focused window to a relative workspace
bind = $mainMod+Shift+Ctrl, bracketright, movetoworkspace, r+1
bind = $mainMod+Shift+Ctrl, bracketleft, movetoworkspace, r-1

# Move focused window around the current workspace
bind = $mainMod+Ctrl, M, movewindow, l
bind = $mainMod+Ctrl, N, movewindow, r
bind = $mainMod+Ctrl, E, movewindow, u
bind = $mainMod+Ctrl, I, movewindow, d

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/Resize focused window
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# Move/Switch to special workspace (scratchpad)
bind = $mainMod+Shift, S, movetoworkspacesilent, special
bind = $mainMod, S, togglespecialworkspace,

# Toggle focused window split
# bind = $mainMod+Alt, S, togglesplit

# Move focused window to a workspace silently
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod+Alt, 0, movetoworkspacesilent, 10
