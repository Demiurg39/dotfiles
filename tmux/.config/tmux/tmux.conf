# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin "catppuccin/tmux"
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'sainnhe/tmux-fzf'



#  ▗▄▖ ▗▄▄▖▗▄▄▄▖▗▄▄▖
# ▐▌ ▐▌▐▌ ▐▌ █ ▐▌   
# ▐▌ ▐▌▐▛▀▘  █  ▝▀▚▖
# ▝▚▄▞▘▐▌    █ ▗▄▄▞▘
                    
                    
                    

set -g mouse on # Enable mouse

set-option -g status-position top # Status bar on top

# Start windows & panes index at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g history-limit 50000 # Terminal scrollback

set-window-option -g mode-keys vi # Set vi-mode

# resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-boot 'on'

# Catppuccion
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"



# ▗▄▄▖ ▗▄▄▄▖▗▖  ▗▖▗▄▄▄  ▗▄▄▖
# ▐▌ ▐▌  █  ▐▛▚▖▐▌▐▌  █▐▌   
# ▐▛▀▚▖  █  ▐▌ ▝▜▌▐▌  █ ▝▀▚▖
# ▐▙▄▞▘▗▄█▄▖▐▌  ▐▌▐▙▄▄▀▗▄▄▞▘
                            
                            
                            

# Map default prefix
set -g prefix C-s
unbind C-b
bind-key C-s send-prefix

# config restart
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Pane navigations
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

bind -n M-p next-window
bind -n M-n previous-window


# Split windows
unbind %
# bind h split-window -h -c "#{pane_current_path}"
unbind '"'
# bind v split-window -v -c "#{pane_current_path}"

# Resize bind

# Resize panes
# bind -r j resize-pane -D 5
# bind -r k resize-pane -U 5
# bind -r l resize-pane -R 5
# bind -r h resize-pane -L 5
# bind -r m resize-pane -Z 5

# Vim-like yank
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection

# Enable mouse dragging
# unbind -T copy-mode-vi MouseDragEnd1Pane

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
